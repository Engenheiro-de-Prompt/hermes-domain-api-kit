name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: IANA timezone data (portable report calendars)
        run: python -m pip install -r requirements-timezones.txt
      - name: Check public content
        run: python -B tools/check_publication.py
      - name: Offline synthetic tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
          HERMES_CLASSIFIER_API_KEY: ''
          HERMES_CLASSIFIER_KEY_FILE: ''
          HERMES_CLASSIFIER_API_BASE: ''
        run: python -B -m unittest discover -s tests -q
